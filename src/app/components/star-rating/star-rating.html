<div class="stars" (mouseleave)="onLeave()">
  @for (star of stars; track star) {
    <button
      type="button"
      class="star"
      [class.filled]="star <= displayedRating()"
      [attr.aria-label]="'Noter ' + star + ' sur 5'"
      (mouseenter)="onHover(star)"
      (click)="onClick(star)"
    >
      ★
    </button>
  }
</div>
