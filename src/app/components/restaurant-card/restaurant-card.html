<article class="card">
  <h2 class="card__name">{{ restaurant().name }}</h2>
  <p class="card__district">{{ restaurant().district }}, Douala</p>
  <p class="card__specialty">Spécialité : {{ restaurant().specialty }}</p>

  <app-star-rating
    [currentRating]="restaurant().currentRating"
    (ratingChanged)="onRatingChanged($event)"
  />

  <p class="card__rating">
    @if (restaurant().currentRating > 0) {
      ({{ restaurant().currentRating }}/5)
    } @else {
      Cliquez !
    }
  </p>
</article>
